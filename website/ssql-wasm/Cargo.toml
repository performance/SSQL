[package]
name = "ssql-wasm"
version = "0.2.1"
edition = "2021"
description = "WebAssembly bindings for the SSQL (Samskrtam SQL) compiler, formatter, linter, grammatical analyzer (Adhyeta), and reverse SQL->SSQL transpiler"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ssql_compiler = { path = "../.." }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chumsky = { version = "0.13", features = ["memoization"] }

[workspace]

[profile.release]
strip = true
lto = true
opt-level = "z"
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false


