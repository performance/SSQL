[package]
name = "ssql-lsp"
version = "0.2.1"
edition = "2021"
description = "Language Server Protocol implementation for SSQL (Samskrtam SQL)"
license = "Apache-2.0"
repository = "https://github.com/performance/SSQL"
publish = false

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssql_compiler = { path = "../", version = "0.2.1" }
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
regex = "1.12.2"
